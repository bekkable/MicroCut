# Push a tag `v<version>` (the version in Cargo.toml) to build the release archives on Windows, macOS and Linux
# (`cargo xtask dist`) and open a draft release with them and SHA256SUMS.txt. Review the draft on GitHub, then publish.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qx "version = \"$version\"" Cargo.toml; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version in Cargo.toml"
            exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.os }})
    needs: ci
    strategy:
      matrix:
        # Linux: the oldest supported runner, so the binary also runs on older glibc versions.
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libgtk-3-dev

      - name: Both architectures (macOS)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - run: cargo xtask dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --verify-tag
          --title "MicroCut ${GITHUB_REF_NAME#v}"
          --generate-notes
