[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "xtask"]
default-members = ["apps/microcut"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Najoko/MicroCut"

[workspace.dependencies]
# Internal crates
microcut-engine = { path = "crates/engine" }
microcut-media = { path = "crates/media" }
microcut-time = { path = "crates/time" }

# External
# Sound output (Apache-2.0); WASAPI / CoreAudio / ALSA (system library, linked dynamically).
cpal = "0.18"
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    # Settings kept between runs (export codecs); adds `ron` (MIT OR Apache-2.0).
    "persistence",
    "wayland",
    "wgpu",
    "x11",
] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Build only (MIT): icon and version information in the Windows exe, via the Windows SDK's resource compiler.
winresource = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"
dbg_macro = "warn"
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
